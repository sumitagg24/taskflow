name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Audit server dependencies (fail on high+)
        run: npm audit --prefix server --audit-level=high
      - name: Audit client dependencies (fail on high+)
        run: npm audit --prefix client --audit-level=high

  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Run server tests
        run: npm test --prefix server

  client-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Run client tests
        run: npm test --prefix client
      - name: Typecheck client
        run: npm run typecheck --prefix client
      - name: Build client
        run: npm run build --prefix client
