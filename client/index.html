<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TaskFlow - Premium Task Management Application" />
    <meta name="theme-color" content="#FACC15" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TaskFlow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>TaskFlow</title>
    <script>
      // Apply the saved theme class immediately — before any CSS loads — to
      // prevent a flash of the wrong theme.  Handles all three states:
      // stored 'light', stored 'dark', and uninitialized (defaults to dark).
      var stored = localStorage.getItem('theme');
      if (stored === 'light') {
        document.documentElement.classList.add('light');
      } else {
        // Default: dark.  Must also remove 'light' in case a previous
        // session left it on the element (e.g. after a crash mid-toggle).
        document.documentElement.classList.remove('light');
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
