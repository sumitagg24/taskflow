<!-- Maskable variant: full-bleed clay field with no corner radius, so the
     platform's mask (circle, squircle, teardrop…) defines the silhouette.
     All strokes sit within 11.5 units of centre on the 32 grid, inside the
     12.8-unit maskable safe zone. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512" role="img" aria-label="TaskFlow">
  <rect width="32" height="32" fill="#cc785c"/>
  <g stroke="#faf9f5" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M8 10L15 13"/>
    <path d="M8 16H19.5"/>
    <path d="M8 22L15 19"/>
  </g>
  <circle cx="22" cy="16" r="2.5" fill="#faf9f5"/>
</svg>
